<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeFileHub login</title>
</head>
<body>
  <main>
    <h1 id="site-name">SafeFileHub</h1>
    <img id="login-logo" hidden alt="">
    <form id="login-form">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    // Keep the login bootstrap self-contained: a failed session must not make
    // the page depend on the authenticated transfer application bundle.
    const status = document.querySelector('#status');
    const name = document.querySelector('#site-name');
    const logo = document.querySelector('#login-logo');
    fetch('/api/site-settings', { credentials: 'same-origin' })
      .then(response => response.ok ? response.json() : Promise.reject(new Error('branding unavailable')))
      .then(settings => {
        name.textContent = settings.site_name || 'SafeFileHub';
        document.title = `${name.textContent} login`;
        if (settings.login_logo_url) { logo.src = settings.login_logo_url; logo.hidden = false; }
      }).catch(() => {});
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const fields = event.currentTarget.elements;
      status.textContent = 'Signing in…';
      try {
        const response = await fetch('/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: fields.username.value, password: fields.password.value }),
        });
        if (!response.ok) throw new Error('invalid credentials');
        location.assign('/');
      } catch (error) { status.textContent = error.message; }
    });
  </script>
</body>
</html>
